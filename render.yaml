services:
  - type: web
    name: gamevault-app
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: gamevault-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: GAMEVAULT_HOSTED
        value: "1"
      - key: GAMEVAULT_PUBLIC_HOST
        value: "1"
      - key: GAMEVAULT_DATA_DIR
        value: /var/data/data
      - key: GAMEVAULT_LIBRARY_DIR
        value: /var/data/library
      - key: GAMEVAULT_ADMIN_EMAIL
        sync: false
      - key: GAMEVAULT_ADMIN_PASSWORD
        sync: false
