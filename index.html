<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault — Connexion</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #050a12;
            --panel: #0b1220;
            --border: #1a2a40;
            --accent: #00aaff;
            --accent2: #0066cc;
            --glow: rgba(0, 170, 255, 0.15);
            --text: #c8d8e8;
            --muted: #4a6080;
            --error: #ff4060;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,170,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,170,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,100,200,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeIn 0.8s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeIn 0.8s ease 0.1s both;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0,170,255,0.4), 0 0 60px rgba(0,170,255,0.1);
            position: relative;
        }

        .logo-icon::before {
            content: '◈';
            font-size: 28px;
            color: white;
        }

        .logo h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: white;
        }

        .logo h1 span {
            color: var(--accent);
        }

        .logo p {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Card */
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 32px;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.8s ease 0.2s both;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.6;
        }

        /* Corner decorations */
        .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: var(--accent);
            border-style: solid;
            opacity: 0.4;
        }
        .corner-tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
        .corner-tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
        .corner-bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
        .corner-br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

        .card-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: white;
            margin-bottom: 28px;
            text-align: center;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.3s;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 14px 13px 42px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            font-family: 'Exo 2', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,170,255,0.1), 0 0 20px rgba(0,170,255,0.05);
        }

        input:focus + .input-icon,
        .input-wrap:focus-within .input-icon {
            color: var(--accent);
        }

        input::placeholder { color: var(--muted); }

        /* Password toggle */
        .toggle-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            transition: color 0.3s;
        }
        .toggle-pass:hover { color: var(--accent); }

        /* Options row */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 12px;
            color: var(--muted);
            user-select: none;
        }

        .remember input[type="checkbox"] {
            width: 14px;
            height: 14px;
            padding: 0;
            accent-color: var(--accent);
        }

        .forgot {
            font-size: 12px;
            color: var(--accent);
            text-decoration: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        .forgot:hover { opacity: 1; }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(0,170,255,0.3);
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 30px rgba(0,170,255,0.5);
        }

        .btn-submit:hover::before { opacity: 1; }
        .btn-submit:active { transform: translateY(0); }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Register link */
        .register {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }

        .register a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .register a:hover { opacity: 0.8; }

        /* Status bar */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
            padding: 10px 14px;
            background: rgba(0,255,100,0.05);
            border: 1px solid rgba(0,255,100,0.1);
            border-radius: 6px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #00cc66;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #00cc66;
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px #00cc66; }
            50% { opacity: 0.4; box-shadow: none; }
        }

        /* Error message */
        .error-msg {
            display: none;
            padding: 10px 14px;
            background: rgba(255,64,96,0.08);
            border: 1px solid rgba(255,64,96,0.2);
            border-radius: 6px;
            font-size: 12px;
            color: var(--error);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
    <div class="logo">
        <div class="logo-icon"></div>
        <h1>Game<span>Vault</span></h1>
        <p>Plateforme de jeux</p>
    </div>

    <div class="card">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div class="card-title">Connexion</div>

        <div class="error-msg" id="errorMsg">⚠ Identifiants incorrects. Veuillez réessayer.</div>

        <form action="/login" method="POST" id="loginForm">
            <div class="form-group">
                <label for="username">Identifiant</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" placeholder="Votre nom d'utilisateur" autocomplete="username">
                    <span class="input-icon">👤</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
                    <span class="input-icon">🔒</span>
                    <button type="button" class="toggle-pass" onclick="togglePassword()">👁</button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" name="remember"> Se souvenir de moi
                </label>
                <a href="#" class="forgot">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="btn-submit">Se connecter</button>
        </form>

        <div class="divider"><span>ou</span></div>

        <div class="register">
            Pas encore de compte ? <a href="#">Créer un compte</a>
        </div>

        <div class="status-bar">
            <div class="status-dot"></div>
            Serveur local actif — localhost:8080
        </div>
    </div>
</div>

<script>
    // Génère des particules flottantes
    const container = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (8 + Math.random() * 15) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
        container.appendChild(p);
    }

    // Toggle mot de passe
    function togglePassword() {
        const input = document.getElementById('password');
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Validation basique
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const err = document.getElementById('errorMsg');

        if (!user || !pass) {
            e.preventDefault();
            err.style.display = 'block';
            err.textContent = '⚠ Veuillez remplir tous les champs.';
        }
    });
</script>
</body>
</html>
